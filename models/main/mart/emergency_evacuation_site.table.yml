schema: main
name: emergency_evacuation_site
title: 指定緊急避難場所
description: '全国の指定緊急避難場所（災害対策基本法第49条の4）の位置（ポイント）。

  市区町村が災害種別ごとに指定した、切迫した災害の危険から命を守るために避難する場所。

  「指定緊急避難場所データ」（国土地理院）（https://hinanmap.gsi.go.jp/）を加工して作成。

  緯度・経度が欠損する行は除外している。'
keywords:
  - 防災
  - 避難場所
  - 避難所
  - GIS
  - 国土地理院
published: true
sources:
