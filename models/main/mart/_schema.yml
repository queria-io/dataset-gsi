version: 2

models:
  - name: emergency_evacuation_site
    access: public
    columns:
      - name: site_id
        data_type: varchar
      - name: muni_name
        data_type: varchar
      - name: site_name
        data_type: varchar
      - name: address
        data_type: varchar
      - name: for_flood
        data_type: boolean
      - name: for_landslide
        data_type: boolean
      - name: for_storm_surge
        data_type: boolean
      - name: for_earthquake
        data_type: boolean
      - name: for_tsunami
        data_type: boolean
      - name: for_large_fire
        data_type: boolean
      - name: for_inland_flooding
        data_type: boolean
      - name: for_volcano
        data_type: boolean
      - name: same_address_as_shelter
        data_type: boolean
      - name: latitude
        data_type: double
      - name: longitude
        data_type: double
      - name: geometry
        data_type: geometry
      - name: note
        data_type: varchar

  - name: designated_shelter
    access: public
    columns:
      - name: site_id
        data_type: varchar
      - name: muni_name
        data_type: varchar
      - name: site_name
        data_type: varchar
      - name: address
        data_type: varchar
      - name: same_address_as_evacuation_site
        data_type: boolean
      - name: additional_matters
        data_type: varchar
      - name: accepted_evacuees
        data_type: varchar
      - name: latitude
        data_type: double
      - name: longitude
        data_type: double
      - name: geometry
        data_type: geometry
      - name: note
        data_type: varchar

  - name: municipality_area
    access: public
    columns:
      - name: survey_date
        data_type: date
      - name: area_code
        data_type: varchar
      - name: area_type
        data_type: varchar
      - name: prefecture_name
        data_type: varchar
      - name: county_name
        data_type: varchar
      - name: area_name
        data_type: varchar
      - name: area_km2
        data_type: double
      - name: is_reference_value
        data_type: boolean
      - name: note
        data_type: varchar

  - name: disaster_lore_monument
    access: public
    columns:
      - name: monument_id
        data_type: varchar
        data_tests:
          - unique
          - not_null
      - name: municipality_code
        data_type: varchar
      - name: monument_name
        data_type: varchar
      - name: erected_year_label
        data_type: varchar
      - name: erected_year
        data_type: integer
      - name: address
        data_type: varchar
      - name: disaster_name
        data_type: varchar
      - name: disaster_type
        data_type: varchar
      - name: is_flood
        data_type: boolean
      - name: is_landslide
        data_type: boolean
      - name: is_storm_surge
        data_type: boolean
      - name: is_earthquake
        data_type: boolean
      - name: is_tsunami
        data_type: boolean
      - name: is_volcano
        data_type: boolean
      - name: is_other
        data_type: boolean
      - name: lore
        data_type: varchar
      - name: latitude
        data_type: double
      - name: longitude
        data_type: double
      - name: geometry
        data_type: geometry
      - name: published_date
        data_type: date
      - name: last_revised_date
        data_type: date
      - name: restriction
        data_type: varchar

  - name: mountain
    access: public
    columns:
      - name: mountain_id
        data_type: integer
      - name: index_number
        data_type: varchar
      - name: mountain_index
        data_type: integer
      - name: mountain_name
        data_type: varchar
      - name: peak_name
        data_type: varchar
      - name: mountain_name_kana
        data_type: varchar
      - name: peak_name_kana
        data_type: varchar
      - name: elevation_m
        data_type: integer
      - name: point_type
        data_type: varchar
      - name: prefectures
        data_type: varchar
      - name: prefecture_names
        data_type: varchar[]
      - name: latitude
        data_type: double
      - name: longitude
        data_type: double
      - name: geometry
        data_type: geometry
