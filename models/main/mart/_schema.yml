version: 2

models:
  - name: emergency_evacuation_site
    description: |
      全国の指定緊急避難場所（災害対策基本法第49条の4）の位置（ポイント）。
      市区町村が災害種別ごとに指定した、切迫した災害の危険から命を守るために避難する場所。
      「指定緊急避難場所データ」（国土地理院）（https://hinanmap.gsi.go.jp/）を加工して作成。
      緯度・経度が欠損する行は除外している。
    access: public
    columns:
      - name: site_id
        data_type: varchar
      - name: muni_name
        data_type: varchar
      - name: site_name
        data_type: varchar
      - name: address
        data_type: varchar
      - name: for_flood
        data_type: boolean
      - name: for_landslide
        data_type: boolean
      - name: for_storm_surge
        data_type: boolean
      - name: for_earthquake
        data_type: boolean
      - name: for_tsunami
        data_type: boolean
      - name: for_large_fire
        data_type: boolean
      - name: for_inland_flooding
        data_type: boolean
      - name: for_volcano
        data_type: boolean
      - name: same_address_as_shelter
        data_type: boolean
      - name: latitude
        data_type: double
      - name: longitude
        data_type: double
      - name: geometry
        data_type: geometry
      - name: note
        data_type: varchar

  - name: designated_shelter
    description: |
      全国の指定避難所（災害対策基本法第49条の7）の位置（ポイント）。
      市区町村が指定した、災害により住居を失った場合等に一定期間滞在して生活する施設。
      「指定緊急避難場所データ」（国土地理院）（https://hinanmap.gsi.go.jp/）を加工して作成。
      緯度・経度が欠損する行は除外している。
    access: public
    columns:
      - name: site_id
        data_type: varchar
      - name: muni_name
        data_type: varchar
      - name: site_name
        data_type: varchar
      - name: address
        data_type: varchar
      - name: same_address_as_evacuation_site
        data_type: boolean
      - name: additional_matters
        data_type: varchar
      - name: accepted_evacuees
        data_type: varchar
      - name: latitude
        data_type: double
      - name: longitude
        data_type: double
      - name: geometry
        data_type: geometry
      - name: note
        data_type: varchar

  - name: municipality_area
    description: |
      全国・都道府県・郡・市区町村・政令市の区の面積（k㎡）。1行 = 1地域 × 1時点。2014年から2018年は年1回（10月1日時点）、2019年7月1日時点以降は四半期ごと（2020年4月1日時点は中止）。
      国土地理院「全国都道府県市区町村別面積調」を加工して作成。
    access: public
    columns:
      - name: survey_date
        data_type: date
      - name: area_code
        data_type: varchar
      - name: area_type
        data_type: varchar
      - name: prefecture_name
        data_type: varchar
      - name: county_name
        data_type: varchar
      - name: area_name
        data_type: varchar
      - name: area_km2
        data_type: double
      - name: is_reference_value
        data_type: boolean
      - name: note
        data_type: varchar
