name = "gsi"
command = "python main.py"

[targets.default]
url = "s3://${FDL_S3_BUCKET}"
public_url = "https://data.queria.io"
s3_endpoint = "${FDL_S3_ENDPOINT}"
s3_access_key_id = "${FDL_S3_ACCESS_KEY_ID}"
s3_secret_access_key = "${FDL_S3_SECRET_ACCESS_KEY}"

[targets.local]
url = "~/.local/share/fdl"
public_url = "http://localhost:4001"

[meta]
license = "国土地理院コンテンツ利用規約（公共データ利用規約 PDL 1.0）"
license_url = "https://www.gsi.go.jp/kikakuchousei/kikakuchousei40182.html"
title = "国土地理院"
description = """国土地理院「指定緊急避難場所データ」（https://hinanmap.gsi.go.jp/）を加工して作成。
全国の市区町村が指定する指定緊急避難場所・指定避難所の名称・住所・対応災害種別・位置（ポイント）を提供。"""
cover = "⛑️"
tags = ['防災', '避難場所', '避難所', '指定緊急避難場所', '指定避難所', 'GIS', '国土地理院']
source_url = "https://hinanmap.gsi.go.jp/"
repository_url = "https://github.com/queria-io/dataset-gsi"

[meta.schemas]
main.title = "メイン"
