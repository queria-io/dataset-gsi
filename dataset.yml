spec_version: "0.1"
name: gsi
title: 国土地理院
description: |-
  国土地理院「指定緊急避難場所データ」（https://hinanmap.gsi.go.jp/）を加工して作成。
  全国の市区町村が指定する指定緊急避難場所・指定避難所の名称・住所・対応災害種別・位置（ポイント）を提供。
keywords:
  - 防災
  - 避難場所
  - 避難所
  - 指定緊急避難場所
  - 指定避難所
  - GIS
  - 国土地理院
homepage: https://github.com/queria-io/dataset-gsi
language: ja

