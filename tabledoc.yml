name: gsi
title: 国土地理院
description: |-
  国土地理院が公開する、全国の指定緊急避難場所・指定避難所の位置と対応する災害、全国・都道府県・市区町村の面積の推移、自然災害伝承碑の位置と伝承内容、日本の主な山岳の山頂の位置と標高です。

  出典：国土地理院「指定緊急避難場所データ」「全国都道府県市区町村別面積調」「自然災害伝承碑データ」「日本の主な山岳標高」を加工して作成。
